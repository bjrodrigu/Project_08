spring.application.name=campus_rating_system

# DataSource configuration. Override with env vars; defaults are for local dev only.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_rating_system?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:temppassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Sample data (src/main/resources/data.sql) runs after Hibernate creates the tables.
# The script uses INSERT IGNORE with fixed ids, so restarts never duplicate rows.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SQL_INIT_MODE:always}

# DEV-ONLY default secret (base64, >= 256 bits). Set JWT_SECRET to your own, e.g. `openssl rand -base64 48`.
security.jwt.secret-key=${JWT_SECRET:DEVONLYinsecureJwtSecretDoNotUseOutsideLocalDevChangeMe012345678}
# 1h in millisecond
security.jwt.expiration-time=3600000
